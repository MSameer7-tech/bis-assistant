<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1124"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8678F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Outer Precision Hexagonal Standards Frame -->
  <polygon points="32,10 49,17 54,34 43,49 21,49 10,34 15,17" 
           fill="none" stroke="#6C63FF" stroke-width="1.8" stroke-dasharray="3,1.5" opacity="0.6"/>

  <!-- Main Geometric BIS Standard Vault / Diamond Core -->
  <path d="M32 14 L48 25 L48 41 L32 50 L16 41 L16 25 Z" 
        fill="rgba(134, 120, 249, 0.12)" stroke="url(#glowGrad)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Inner Interlocking 'IS' Geometry (Indian Standard Precision Monogram) -->
  <!-- Central Pillar (I) -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Symmetric Standards Caliper Wings / Chevrons (S geometry) -->
  <path d="M24 24 L32 20 L40 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 32 L32 32 L42 32" fill="none" stroke="#8678F9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M24 40 L32 44 L40 40" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Verification Diamond Node -->
  <polygon points="32,29 35,32 32,35 29,32" fill="#8678F9"/>

  <!-- Grounding Verification Status Indicator Dot (Emerald Green) -->
  <circle cx="48" cy="16" r="3.2" fill="#10B981" stroke="#06070e" stroke-width="1.5"/>
</svg>
